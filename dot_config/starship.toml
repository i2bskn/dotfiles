# Prompt
format = """
$directory\
$git_branch\
$git_status\
$golang\
$nodejs\
$python\
$aws\
$gcloud\
$line_break\
$character"""

# miseの初期起動のオーバーヘッドでタイムアウトする事があるのでデフォルトの500msから少し伸ばす
command_timeout = 1000

# Directory
[directory]
truncate_to_repo = true
truncation_length = 5

# Golang
[golang]
format = "via [🐹 $version](bold cyan) "

# Node.js
[nodejs]
format = 'via [⬢ $version](bold green) '

# Python
[python]
format = 'via [🐍 $version( \($virtualenv\))](bold yellow) '

# AWS
[aws]
format = '[☁️ $profile | $region]($style) '
style = "bold yellow"
disabled = false

# Google Cloud
[gcloud]
disabled = true

